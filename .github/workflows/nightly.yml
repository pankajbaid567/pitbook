name: nightly-stress
on:
  schedule: [{cron: '23 2 * * *'}]
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go test -race -count=10 ./...
      - run: make prop
      - run: go test -run xxx -fuzz FuzzDecodeCommand -fuzztime 120s ./internal/engine
      - run: go test -run xxx -fuzz FuzzOpenNeverPanics -fuzztime 120s ./internal/wal
      - run: make build
      - name: crash test, 300 runs
        run: ./bin/crashtest -bin bin/pitbook -runs 300 -parallel 2
